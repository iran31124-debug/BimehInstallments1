name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify project structure
        run: |
          echo "PWD=$(pwd)"
          echo "--- root ---"
          ls -la
          echo "--- app ---"
          test -d app || (echo 'ERROR: app/ folder is missing from repository root'; exit 1)
          test -f settings.gradle || (echo 'ERROR: settings.gradle is missing'; exit 1)
          test -f app/build.gradle || (echo 'ERROR: app/build.gradle is missing'; exit 1)
          ls -la app

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BimehInstallments-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
